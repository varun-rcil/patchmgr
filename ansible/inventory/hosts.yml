---
# Two orthogonal groupings, and every host appears in both:
#   OS groups (windows / rhel / ubuntu)  -> decide HOW to scan and apply
#   Ring groups (ring_canary/pilot/prod) -> decide WHEN, and gate approvals
#
# patch_targets is the umbrella the ring map and shared plays iterate.
#
# WORKGROUP NOTE: no AD usually means no DNS - ansible_host carries the IP, and
# WinRM certificates must carry that IP in their SAN (make_ca.sh --ip).
all:
  children:
    patch_targets:
      children:
        windows:
          hosts:
            WIN2022-CANARY1: { ansible_host: 192.168.100.101 }
            WIN2022-SQL1:    { ansible_host: 192.168.100.121, patch_serial: 1 }
            WIN2022-SQL2:    { ansible_host: 192.168.100.122, patch_serial: 1 }
        linux:
          children:
            rhel:
              hosts:
                RHEL9-APP1:    { ansible_host: 192.168.100.131 }
                RHEL10-APP1:   { ansible_host: 192.168.100.132 }
                ROCKY9-WEB1:   { ansible_host: 192.168.100.133 }
                # RHEL 7 is past EOL: new errata require an ELS subscription.
                # The scanner still works; it just may find nothing new.
                RHEL7-LEGACY1: { ansible_host: 192.168.100.139 }
            ubuntu:
              hosts:
                UBU2404-WEB1:  { ansible_host: 192.168.100.141 }
                UBU2204-APP1:  { ansible_host: 192.168.100.142 }

    # Rings reference the same hosts by name - a host may appear in exactly one.
    ring_canary:
      hosts:
        WIN2022-CANARY1:
        UBU2404-WEB1:
        ROCKY9-WEB1:
    ring_pilot:
      hosts:
        RHEL9-APP1:
        UBU2204-APP1:
    ring_prod:
      hosts:
        WIN2022-SQL1:
        WIN2022-SQL2:
        RHEL10-APP1:
        RHEL7-LEGACY1:
